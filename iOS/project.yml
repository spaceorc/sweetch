name: SweetchPhone
options:
  bundleIdPrefix: com.spaceorc.sweetch
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: NM8L8BPQWD
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SweetchPhone:
    type: application
    platform: iOS
    sources:
      - SweetchPhone
      - Shared
      # The dictation pipeline, the Mac's own code — the phone runs it when no Mac answers.
      - path: ../Sources/sweetch/Pipeline
      # The statistics' screens, the Mac's window's too.
      - path: ../Sources/sweetch/Views
      # The keyboard's code too, for `--keyboard-preview`.
      - path: SweetchKeyboard
        excludes: [Info.plist]
      # The app icon, the Mac's too: Icon Composer's, in layers.
      - path: ../Resources/icon/AppIcon.icon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spaceorc.sweetch.phone
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
    entitlements:
      path: SweetchPhone/SweetchPhone.entitlements
      properties:
        com.apple.security.application-groups: [group.com.spaceorc.sweetch]
    info:
      path: SweetchPhone/Info.plist
      properties:
        CFBundleDisplayName: Sweetch
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Sweetch records what you dictate and hears it on your Mac.
        NSSpeechRecognitionUsageDescription: Sweetch shows the words as you say them.
        NSSupportsLiveActivities: true
        NSLocalNetworkUsageDescription: Sweetch reaches your Mac on the local network when Tailscale is off.
        SweetchToken: $(SWEETCH_TOKEN)
        SweetchCommit: $(SWEETCH_COMMIT)
        UIBackgroundModes: [audio]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.spaceorc.sweetch.phone
            CFBundleURLSchemes: [sweetch]
    dependencies:
      - target: SweetchWidget
      - target: SweetchKeyboard
      # whisper.cpp, to hear on the phone itself (an experiment; `make whisper-framework`).
      - framework: Vendor/whisper.xcframework
        embed: true
  SweetchWidget:
    type: app-extension
    platform: iOS
    sources: [SweetchWidget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spaceorc.sweetch.phone.widget
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: SweetchWidget/Info.plist
      properties:
        CFBundleDisplayName: Sweetch
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  SweetchKeyboard:
    type: app-extension
    platform: iOS
    sources: [SweetchKeyboard, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spaceorc.sweetch.phone.keyboard
        GENERATE_INFOPLIST_FILE: YES
    entitlements:
      path: SweetchKeyboard/SweetchKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.com.spaceorc.sweetch]
    info:
      path: SweetchKeyboard/Info.plist
      properties:
        CFBundleDisplayName: Sweetch
        SweetchToken: $(SWEETCH_TOKEN)
        SweetchCommit: $(SWEETCH_COMMIT)
        NSLocalNetworkUsageDescription: The keyboard reaches your Mac on the local network when Tailscale is off.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: ru-RU
            RequestsOpenAccess: true
